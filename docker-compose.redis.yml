version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: farmacia_ia_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - farmacia_network

volumes:
  redis_data:
    driver: local

networks:
  farmacia_network:
    driver: bridge
