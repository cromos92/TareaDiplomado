version: '3.8'

services:
  # ============================================================================
  # Base de Datos PostgreSQL
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: farmacia_ia_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farmacia_ia}
      POSTGRES_USER: ${POSTGRES_USER:-farmacia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmacia_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farmacia_user} -d ${POSTGRES_DB:-farmacia_ia}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - farmacia_network
    restart: unless-stopped

  # ============================================================================
  # Redis Cache y Sessions
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: farmacia_ia_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-farmacia_redis_pass}
    volumes:
      - redis_data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - farmacia_network
    restart: unless-stopped

  # ============================================================================
  # Qdrant Vector Database
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: farmacia_ia_qdrant
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - qdrant_data:/qdrant/storage
      - ./docker/qdrant-config.yaml:/qdrant/config/production.yaml:ro
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - farmacia_network
    restart: unless-stopped

  # ============================================================================
  # Django Backend
  # ============================================================================
  django:
    build:
      context: .
      dockerfile: docker/Dockerfile.django
      target: ${BUILD_TARGET:-development}
    container_name: farmacia_ia_django
    environment:
      # Django settings
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,django}
      
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-farmacia_user}:${POSTGRES_PASSWORD:-farmacia_password}@postgres:5432/${POSTGRES_DB:-farmacia_ia}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-farmacia_redis_pass}@redis:6379/0
      
      # Security
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dGVzdF9lbmNyeXB0aW9uX2tleV8zMl9ieXRlcw==}
      
      # External APIs
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MINSAL_API_URL: ${MINSAL_API_URL:-https://api.minsal.cl}
      
      # Qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-vademecum}
      
      # Monitoring
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
      - django_static:/app/staticfiles
      - django_media:/app/media
      - django_logs:/app/logs
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - farmacia_network
    restart: unless-stopped
    command: >
      sh -c "
        ./scripts/wait-for.sh postgres:5432 -- 
        ./scripts/wait-for.sh redis:6379 -- 
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "

  # ============================================================================
  # FastAPI Microservice
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: ${BUILD_TARGET:-development}
    container_name: farmacia_ia_api
    environment:
      # FastAPI settings
      DEBUG: ${DEBUG:-True}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-farmacia_redis_pass}@redis:6379/1
      
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://django:8000}
      
      # External APIs
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # Rate limiting
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-10}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1 minute}
      
      # Monitoring
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    volumes:
      - ./api:/app
      - api_logs:/app/logs
    ports:
      - "${API_PORT:-8001}:8001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - farmacia_network
    restart: unless-stopped
    command: >
      sh -c "
        ../scripts/wait-for.sh redis:6379 -- 
        uvicorn main:app --host 0.0.0.0 --port 8001 --reload
      "

  # ============================================================================
  # Nginx Reverse Proxy (Opcional para producción)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: farmacia_ia_nginx
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
      - django_static:/var/www/static:ro
      - django_media:/var/www/media:ro
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    depends_on:
      - django
      - api
    networks:
      - farmacia_network
    restart: unless-stopped
    profiles:
      - production

  # ============================================================================
  # Monitoring con Prometheus (Opcional)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: farmacia_ia_prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - farmacia_network
    restart: unless-stopped
    profiles:
      - monitoring

  # ============================================================================
  # Grafana Dashboard (Opcional)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: farmacia_ia_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./docker/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - farmacia_network
    restart: unless-stopped
    profiles:
      - monitoring

# ============================================================================
# Volúmenes
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  django_static:
    driver: local
  django_media:
    driver: local
  django_logs:
    driver: local
  api_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ============================================================================
# Redes
# ============================================================================
networks:
  farmacia_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
