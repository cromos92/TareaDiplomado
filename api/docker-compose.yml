version: '3.8'

services:
  # FastAPI service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DEBUG=True
      - LOG_LEVEL=DEBUG
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    networks:
      - farmacia_network

  # Redis para rate limiting
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - farmacia_network

  # Nginx para load balancing (opcional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - farmacia_network

volumes:
  redis_data:

networks:
  farmacia_network:
    driver: bridge
